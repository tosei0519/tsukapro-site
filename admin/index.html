<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>つかプロ 管理者画面</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

<!-- Login -->
<section class="login" id="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <img src="../assets/logo-mark.png" alt="" width="84" height="84">
    <h1>つかプロ 管理者画面</h1>
    <p class="hint">チーム内の経費・やること・予定をまとめる画面です。</p>
    <div id="email-wrap" hidden>
      <label for="email">メールアドレス</label>
      <input id="email" type="email" autocomplete="username">
    </div>
    <label for="pass" id="pass-label">パスコード</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <p class="err" id="login-err" role="alert" hidden>パスコードが違います。</p>
    <button class="btn-main" type="submit">ログイン</button>
    <p class="demo" id="demo-note">仮ログイン（デモ）です。本物のログインは、Firebaseにつなぐと使えます。詳しくはREADMEを見てください。</p>
    <a class="back" href="https://claude.ai/artifact/E6pvjmybQA6BFUtnfhyrWh" id="team-link">チームで共有する管理画面（claude.ai）を開く →</a>
    <a class="back" href="../">← 公式サイトへ戻る</a>
  </form>
</section>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-brand"><img src="../assets/logo-mark.png" alt="" width="32" height="32"><span>つかプロ 管理</span></div>
    <nav id="menu" aria-label="管理メニュー"></nav>
    <div class="side-foot">
      <span class="who" id="who"></span>
      <a href="../">公式サイトを見る</a>
      <button type="button" id="logout">ログアウト</button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script src="admin.js?v=4"></script>
</body>
</html>
